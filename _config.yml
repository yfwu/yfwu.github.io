# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: YFWu's Blog
email: yfwu@yfwu.org
description: > # this means to ignore newlines until "baseurl:"
  在遙遠的邊陲小島住著一個不愛吃魚愛做夢的捕魚人
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://yfwu.dev" # the base hostname & protocol for your site
github_username: yfwu
locale: zh_TW # used by jekyll-seo-tag for og:locale (was falling back to en_US)

# jekyll-seo-tag reads these (it does not use `twitter_username`)
author:
  name: Yu-Fu Wu
  twitter: yfw3u
twitter:
  username: yfw3u
  card: summary

# Build settings
markdown: kramdown
kramdown:
  input: GFM

# GitHub Pages injects jekyll-theme-primer unless a theme is set explicitly.
# This site ships its own layouts/styles, so disable it (otherwise an unused
# assets/css/style.css from primer is published).
theme: null

# Setting `exclude` replaces Jekyll's default list, so the defaults are repeated.
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# used this for post_excerpt at index_page
# excerpt_separator: <!--description-->

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
