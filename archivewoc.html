---
layout: default
title: Archive Without Categories
---

<div>
  <h2>All posts</h2>
  <section class="archive_list">
    <table>
      {% for post in site.posts %}

      <tr class="post_title">
        <td class="archive_date">{{ post.date | date: "%F" }}</td>
        <td>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </td>
      </tr>

      {% endfor %}
    </table>
  </section>

  <!--<footer class="article-footer" mar>
    {% include author.html %}
  </footer>-->
</div>
